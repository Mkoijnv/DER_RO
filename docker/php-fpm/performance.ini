; Configurações de Performance do PHP
; Este arquivo otimiza o PHP para desenvolvimento/produção

[PHP]
; Limite de memória
memory_limit = 256M

; Limites de upload
upload_max_filesize = 10M
post_max_size = 10M

; Limites de execução
max_execution_time = 60
max_input_time = 60

[opcache]
; Habilitar OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Configurações de memória do OPcache
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Validação de arquivos (desabilitar em produção para mais performance)
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; JIT (Just-In-Time Compilation) - IMPORTANTE!
; Habilita o JIT do PHP 8+ para até 50% mais performance
opcache.jit_buffer_size = 100M
opcache.jit = tracing

; Configurações adicionais de performance
opcache.save_comments = 1
opcache.enable_file_override = 0
opcache.optimization_level = 0x7FFEBFFF

[Date]
date.timezone = America/Porto_Velho


